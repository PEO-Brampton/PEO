<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Bridge Building Competition</title>
    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        
        // This script takes the current URL and converts it into a form that 
        // GitHub Pages can handle by redirecting to the index page with a 
        // special query parameter
        
        const pathSegmentsToKeep = 1; // Keep /PEO/ segment
        const l = window.location;
        
        // Reconstruct the URL parts
        const origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
        const baseUrl = origin + l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        const path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        const search = l.search;
        const hash = l.hash;
        
        // Redirect to index.html with the full path in the URL
        window.location.href = baseUrl + '/?p=/' + path + search + hash;
    </script>
</head>
<body>
    <h1>Page Not Found</h1>
    <p>Redirecting to the main application...</p>
</body>
</html>
