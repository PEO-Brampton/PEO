<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEO Bridge Building Competition</title>
    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        (function(l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
    <script>
        // Get the current path
        const path = window.location.pathname;
        
        // If the path starts with /PEO/, redirect to the main page
        if (path.startsWith('/PEO/')) {
            // Extract the path after /PEO/
            const subPath = path.substring(5); // Remove '/PEO/'
            
            // Redirect to the main page with the path as a query parameter
            window.location.href = '/PEO/?p=' + subPath;
        } else {
            // For other paths, show 404
            document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
        }
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>
