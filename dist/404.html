<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEO Bridge Building Competition</title>
    <script>
        // Get the current path
        const path = window.location.pathname;
        
        // If the path starts with /PEO/, redirect to the main page
        if (path.startsWith('/PEO/')) {
            window.location.href = '/PEO/';
        } else {
            // For other paths, show 404
            document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
        }
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>
